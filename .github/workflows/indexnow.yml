name: IndexNow

# After content lands on main, tell IndexNow search engines which pages changed.
# Uses the committed public key (src/config/indexnow.json) unless the INDEXNOW_KEY secret is set.
# Run it by hand with "all" to submit every URL in the live sitemap (launch day, or after a big batch).
on:
  push:
    branches: [main]
    paths: ["content/**"]
  workflow_dispatch:
    inputs:
      scope:
        description: "changed = pages changed by the last commit; all = every URL in the live sitemap"
        default: all
        type: choice
        options: [all, changed]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the deploy to go live
        if: github.event_name == 'push'
        run: sleep 180
      - run: node scripts/indexnow.mjs ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'all' && '--all' || 'HEAD~1..HEAD' }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://familyfutureplanning.com' }}
          REQUIRE_ATTORNEY_REVIEW: ${{ vars.REQUIRE_ATTORNEY_REVIEW }}
